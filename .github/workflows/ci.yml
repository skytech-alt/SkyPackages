name: CI (Sanity Check)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    name: Repository Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify basic files
        run: |
          echo "Проверка структуры проекта..."
          if [ ! -f "README.md" ]; then echo "Ошибка: README.md не найден"; exit 1; fi
          if [ ! -f "LICENSE" ]; then echo "Ошибка: LICENSE не найден"; exit 1; fi
          echo "Основные файлы на месте. Проект готов."
