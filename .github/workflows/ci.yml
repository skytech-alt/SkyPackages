name: CI (Tests & Lint)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Если нужны другие зависимости для тестов, добавь их сюда
          
      - name: Run pytest
        run: |
          # Ищем все папки с тестами и запускаем их
          pytest .

  test-node:
    name: Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          
      - name: Run vitest
        run: |
          # Находим все package.json и прогоняем тесты там, где они есть
          find . -name "package.json" -not -path "*/node_modules/*" -execdir npm install \; -execdir npm test \;
