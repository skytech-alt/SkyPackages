<style>

  .bg-glow::after { width: 800px; height: 800px; top: 30%; right: -300px; background: radial-gradient(circle, var(--accent-2), transparent 70%); opacity: 0.25; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(8, 8, 12, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }

  .btn-github { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; transition: all 0.15s ease; }
  .btn-github:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }

  .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

  .milestones { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  .milestone-body .badge { display: inline-block; margin-top: 8px; padding: 2px 8px; font-size: 11px; font-family: var(--mono); border-radius: 4px; background: var(--bg-elev); color: var(--gold); border: 1px solid rgba(251,191,36,0.3); }

  .packages-section { max-width: 1200px; margin: 0 auto; padding: 40px 24px 120px; }

  .filter-btn:hover { color: var(--text); }
  .filter-btn.active { background: var(--bg-elev); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search input { width: 100%; padding: 10px 14px 10px 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px; transition: all 0.15s ease; }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search input::placeholder { color: var(--text-dim); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-dim); pointer-events: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; transition: all 0.2s ease; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0; transition: opacity 0.2s ease; }
  .card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .card:hover::before { opacity: 1; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .lang-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .lang-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: 1; box-shadow: 0 2px 8px var(--accent-glow); }

  .btn-ghost { background: var(--bg-elev); border-color: var(--border); color: var(--text-muted); font-family: var(--mono); font-size: 12px; }

  .footer-bottom { max-width: 1200px; margin: 0 auto; padding: 20px 24px 32px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }

  @media (max-width: 768px) {

<script>
const GITHUB_REPO_URL = "https://github.com/skytech-alt/SkyPackages";
const GITHUB_OWNER = "skytech-alt";
const GITHUB_REPO = "SkyPackages";
const LAUNCH_DATE = new Date("2026-10-25T00:00:00Z");

const PACKAGES = JSON.parse(document.getElementById("skypackages-registry").textContent);
const LANG_LABELS = { python: "Python", npm: "npm", skyforge: "SkyForge" };

function downloadUrl(pkg) {
  const tag = pkg.tag || `${pkg.name}-v${pkg.version}`;
  return `${GITHUB_REPO_URL}/releases/download/${tag}/${pkg.downloadFile}`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderBaseStats() {
  const concepts = new Set(PACKAGES.map(p => {
    let name = p.name;
    if (name.startsWith("@skypackages/")) return name.replace("@skypackages/", "");
    if (name.startsWith("skyforge-")) return name.replace("skyforge-", "");
    if (name.startsWith("sky-")) return name.replace("sky-", "");
    return name;
  }));
  
  // Безопасное обновление (проверяем, есть ли элемент)
  const elTotal = document.getElementById("stat-total");
  if (elTotal) elTotal.textContent = concepts.size;
  
  const elReleases = document.getElementById("stat-releases");
  if (elReleases) elReleases.textContent = PACKAGES.length;
  
  const elLangs = document.getElementById("stat-langs");
  if (elLangs) elLangs.textContent = new Set(PACKAGES.map(p => p.language)).size;
  
  const elDays = document.getElementById("stat-days");
  if (elDays) {
    const days = Math.floor((Date.now() - LAUNCH_DATE.getTime()) / (1000 * 60 * 60 * 24));
    elDays.textContent = `${days} дней в строю`;
  }
  
  const elBadge = document.getElementById("badge-skyforge");
  if (elBadge) elBadge.textContent = `${concepts.size} пакетов · ${concepts.size * 100}+ очков`;
}

async function fetchGitHubStats() {
  const CACHE_KEY = "skypackages_gh_stats";
  const TTL = 60 * 60 * 1000;
  try {
    const cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (Date.now() - parsed.ts < TTL) return parsed.data;
    }
  } catch (_) {}
  
  try {
    const headers = { "Accept": "application/vnd.github+json" };
    const [repoRes, releasesRes] = await Promise.all([
      fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, { headers }),
      fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases?per_page=100`, { headers })
    ]);
    if (!repoRes.ok || !releasesRes.ok) throw new Error("GitHub API error");
    const repoData = await repoRes.json();
    const releases = await releasesRes.json();
    
    let downloads = 0;
    for (const rel of releases) {
      for (const asset of rel.assets || []) {
        downloads += asset.download_count || 0;
      }
    }
    
    const stats = {
      stars: repoData.stargazers_count || 0,
      downloads: downloads,
    };
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data: stats, ts: Date.now() }));
    return stats;
  } catch (e) {
    console.warn("GitHub stats unavailable:", e);
    return null;
  }
}

function formatCompact(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

function animateCount(el, target, formatter) {
  const duration = 1000;
  const start = performance.now();
  function tick(now) {
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatter(Math.floor(target * eased));
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = formatter(target);
  }
  requestAnimationFrame(tick);
}

async function renderGitHubStats() {
  const stats = await fetchGitHubStats();
  if (!stats) return;
  
  const elDownloads = document.getElementById("stat-downloads");
  if (elDownloads) animateCount(elDownloads, stats.downloads, formatCompact);
  
  const elStars = document.getElementById("stat-stars");
  if (elStars) elStars.textContent = `⭐ ${formatCompact(stats.stars)}`;
}

function renderCard(pkg) {
  const langLabel = LANG_LABELS[pkg.language] || pkg.language;
  const url = downloadUrl(pkg);
  const tags = (pkg.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
  return `
    <article class="card">
      <div class="card-header">
        <span class="lang-badge ${escapeHtml(pkg.language)}">${escapeHtml(langLabel)}</span>
        <span class="version">v${escapeHtml(pkg.version)}</span>
      </div>
      <h3 class="card-title">${escapeHtml(pkg.name)}</h3>
      <p class="card-desc">${escapeHtml(pkg.description)}</p>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      <div class="card-actions">
        <a class="btn btn-primary" href="${escapeHtml(url)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
          Скачать
        </a>
        <button class="btn btn-ghost" data-copy="${escapeHtml(pkg.install)}" title="Копировать команду установки">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
          Копировать
        </button>
      </div>
    </article>
  `;
}

let currentLang = "all";
let currentQuery = "";

function applyFilters() {
  const q = currentQuery.toLowerCase().trim();
  return PACKAGES.filter(pkg => {
    if (currentLang !== "all" && pkg.language !== currentLang) return false;
    if (!q) return true;
    const haystack = [pkg.name, pkg.description, ...(pkg.tags || [])].join(" ").toLowerCase();
    return haystack.includes(q);
  });
}

function render() {
  const filtered = applyFilters();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  grid.innerHTML = filtered.map(renderCard).join("");
}

document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentLang = btn.dataset.lang;
  render();
});

document.getElementById("search").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  render();
});

document.querySelectorAll("[data-nav-lang]").forEach(a => {
  a.addEventListener("click", () => {
    const lang = a.dataset.navLang;
    const btn = document.querySelector(`.filter-btn[data-lang="${lang}"]`);
    if (btn) btn.click();
  });
});

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const text = btn.getAttribute("data-copy");
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    const originalHTML = btn.innerHTML;
    btn.innerHTML = btn.innerHTML.replace("Копировать", "Скопировано");
    showToast("Команда установки скопирована!");
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = originalHTML;
    }, 2000);
  } catch (err) {
    showToast("Не удалось скопировать");
  }
});

let toastTimer;
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

renderBaseStats();
render();
renderGitHubStats();
</script>
